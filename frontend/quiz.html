<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taking Quiz - AI Quiz System</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body style="background-color: #f1f5f9;">

  <div id="quiz-app-mount">
    <div style="text-align: center; padding: 80px;">
      <span class="spinner" style="width: 36px; height: 36px;"></span>
      <h3 style="margin-top: 16px;">Loading Quiz...</h3>
    </div>
  </div>

  <!-- SUBMISSION CONFIRMATION MODAL -->
  <div class="modal-overlay" id="submit-confirm-modal">
    <div class="modal" style="max-width: 480px;">
      <div class="modal-header">
        <h3 style="font-size: 16px; font-weight: 700;">Submit Quiz?</h3>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('submit-confirm-modal')">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 14px; margin-bottom: 14px;">
          Are you sure you want to finish and submit your quiz attempt?
        </p>

        <div style="background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <span>Answered Questions:</span>
            <strong style="color: var(--success);" id="modal-answered-count">0</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span>Unanswered Questions:</span>
            <strong style="color: var(--danger);" id="modal-unanswered-count">0</strong>
          </div>
        </div>

        <p style="font-size: 12px; color: var(--text-muted);">
          Once submitted, your answers will be evaluated immediately on the backend and cannot be changed.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('submit-confirm-modal')">Return to Quiz</button>
        <button type="button" class="btn btn-success" onclick="submitQuizFinal()">Yes, Submit Final Answers</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
