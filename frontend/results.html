<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Results & Review - AI Quiz System</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    .result-container {
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .score-summary-banner {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 32px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
    }
    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px;
      font-weight: 800;
      border: 4px solid var(--border-focus);
    }
    .review-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }
    .review-option {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .review-option.correct-choice {
      background-color: #ecfdf5;
      border-color: #6ee7b7;
      color: #065f46;
      font-weight: 600;
    }
    .review-option.wrong-selection {
      background-color: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
      font-weight: 600;
    }
  </style>
</head>
<body style="background-color: var(--bg-main);">

  <div class="result-container" id="results-app-mount">
    <div style="text-align: center; padding: 60px;">
      <span class="spinner"></span>
      <p style="margin-top: 12px; color: var(--text-muted);">Loading quiz results...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!Auth.protectPage()) return;

      const urlParams = new URLSearchParams(window.location.search);
      const attemptId = urlParams.get("attemptId");

      if (!attemptId) {
        showToast("Missing attempt reference.", "error");
        setTimeout(() => (window.location.href = "student-dashboard.html"), 1500);
        return;
      }

      loadResults(attemptId);
    });

    async function loadResults(attemptId) {
      const container = document.getElementById("results-app-mount");

      try {
        const res = await fetch(`${API_BASE}/api/quizzes/result/${attemptId}`, {
          headers: Auth.getHeaders(),
        });
        const data = await res.json();

        if (!data.success) {
          container.innerHTML = `
            <div style="background:white; padding:32px; border-radius:var(--radius-md); text-align:center;">
              <h3 style="color:var(--danger);">Results Error</h3>
              <p style="color:var(--text-muted); margin-top:8px;">${data.message || "Could not retrieve attempt results."}</p>
              <a href="student-dashboard.html" class="btn btn-primary" style="margin-top:16px;">Back to Dashboard</a>
            </div>
          `;
          return;
        }

        const result = data.result;
        const isPassed = result.percentage >= 50;

        container.innerHTML = `
          <!-- Summary Header Banner -->
          <div class="score-summary-banner">
            <div class="score-circle">
              ${result.percentage}%
              <span style="font-size:12px; font-weight:600; color:var(--text-muted); margin-top:-4px;">SCORE</span>
            </div>

            <h1 style="font-size:24px; font-weight:800; color:var(--text-main);">${result.quizTitle}</h1>
            <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">
              Completed on ${formatDate(result.completedAt)}
            </p>

            <div style="display:flex; justify-content:center; gap:24px; margin-top:20px;">
              <div>
                <div style="font-size:12px; color:var(--text-muted); font-weight:600;">QUESTIONS ANSWERED</div>
                <div style="font-size:20px; font-weight:700;">${result.total}</div>
              </div>
              <div style="width:1px; background:var(--border-color);"></div>
              <div>
                <div style="font-size:12px; color:var(--text-muted); font-weight:600;">CORRECT ANSWERS</div>
                <div style="font-size:20px; font-weight:700; color:var(--success);">${result.score}</div>
              </div>
              <div style="width:1px; background:var(--border-color);"></div>
              <div>
                <div style="font-size:12px; color:var(--text-muted); font-weight:600;">STATUS</div>
                <div style="font-size:20px; font-weight:700; color:${isPassed ? "var(--success)" : "var(--danger)"};">
                  ${isPassed ? "Passed" : "Needs Review"}
                </div>
              </div>
            </div>

            <div style="margin-top:24px;">
              <a href="student-dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
            </div>
          </div>

          <!-- Question By Question Review -->
          <h2 style="font-size:18px; font-weight:700; margin-bottom:16px;">Question-by-Question Review & Explanations</h2>

          <div id="review-questions-list">
            ${result.review
              .map((q, idx) => {
                const diffClass =
                  q.difficulty === "Easy" ? "badge-easy" : q.difficulty === "Medium" ? "badge-medium" : "badge-hard";

                return `
                <div class="review-card">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                      <span style="font-weight:700; font-size:15px;">Q${idx + 1}.</span>
                      <span class="badge ${diffClass}">${q.difficulty}</span>
                    </div>
                    <span class="badge ${q.is_correct ? "badge-approved" : "badge-rejected"}">
                      ${q.is_correct ? "✓ Correct" : "✕ Incorrect"}
                    </span>
                  </div>

                  <div style="font-weight:600; font-size:16px; margin-bottom:16px;">
                    ${q.question_text}
                  </div>

                  <div style="margin-bottom:16px;">
                    ${q.options
                      .map((opt, oIdx) => {
                        const isCorrectOption = opt.trim() === q.correct_answer.trim();
                        const isSelectedByStudent = opt.trim() === (q.selected_option || "").trim();
                        const letter = String.fromCharCode(65 + oIdx);

                        let optClass = "review-option";
                        let tag = "";

                        if (isCorrectOption) {
                          optClass += " correct-choice";
                          tag = "✓ Correct Answer";
                        } else if (isSelectedByStudent && !isCorrectOption) {
                          optClass += " wrong-selection";
                          tag = "✕ Your Selection";
                        } else if (isSelectedByStudent && isCorrectOption) {
                          tag = "✓ Your Choice";
                        }

                        return `
                          <div class="${optClass}">
                            <span><strong>[${letter}]</strong> ${opt}</span>
                            ${tag ? `<span style="font-size:12px; font-weight:700;">${tag}</span>` : ""}
                          </div>
                        `;
                      })
                      .join("")}
                  </div>

                  <div class="explanation-box">
                    <strong>💡 AI Explanation:</strong> ${q.explanation}
                  </div>
                </div>
              `;
              })
              .join("")}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p style="color:var(--danger); text-align:center;">Failed to load results: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
